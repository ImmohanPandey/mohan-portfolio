<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic celebrity management system visualization</title>
  <desc id="desc">A stylized stage, spotlight beams, profile hologram and connected management data cards.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08070d"/><stop offset=".55" stop-color="#110912"/><stop offset="1" stop-color="#080914"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5ea8"/><stop offset="1" stop-color="#9a7cff"/></linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".32"/><stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/></linearGradient>
    <filter id="g4"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="s4"><feGaussianBlur stdDeviation="48"/></filter>
