<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic inventory system visualization</title>
  <desc id="desc">Neon warehouse shelves, smart packages, scan beams and data overlays on a dark grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset=".55" stop-color="#0a1117"/><stop offset="1" stop-color="#07100d"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfff67"/><stop offset="1" stop-color="#43f5bd"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b7ff3c" stop-opacity="0"/><stop offset=".5" stop-color="#b7ff3c" stop-opacity=".9"/><stop offset="1" stop-color="#50e7ff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1240" cy="180" r="250" fill="#b7ff3c" fill-opacity=".08" filter="url(#soft)"/>
  <circle cx="360" cy="770" r="220" fill="#50e7ff" fill-opacity=".07" filter="url(#soft)"/>

  <g opacity=".8" stroke="#50e7ff" stroke-opacity=".18" fill="none">
    <path d="M110 760L790 340L1500 690"/>
    <path d="M210 870L810 510L1430 810"/>
    <path d="M380 920L840 650L1270 900"/>
  </g>

  <g transform="translate(180 230)">
    <g fill="#0d151d" stroke="#ffffff" stroke-opacity=".08">
      <rect x="0" y="0" width="180" height="500" rx="16"/><rect x="225" y="-45" width="205" height="545" rx="16"/><rect x="475" y="-100" width="225" height="600" rx="16"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".08">
      <path d="M20 135H160M20 270H160M20 405H160"/><path d="M245 95H410M245 235H410M245 375H410"/><path d="M495 55H680M495 200H680M495 345H680"/>
    </g>
    <g fill="url(#box)" filter="url(#glow)">
      <rect x="43" y="72" width="74" height="46" rx="7" opacity=".85"/><rect x="273" y="18" width="91" height="54" rx="8" opacity=".55"/><rect x="525" y="-25" width="104" height="60" rx="9" opacity=".82"/>
      <rect x="42" y="208" width="100" height="42" rx="7" opacity=".45"/><rect x="275" y="165" width="68" height="48" rx="7" opacity=".9"/><rect x="530" y="132" width="115" height="46" rx="8" opacity=".48"/>
      <rect x="45" y="340" width="72" height="49" rx="7" opacity=".72"/><rect x="279" y="304" width="110" height="47" rx="7" opacity=".48"/><rect x="534" y="278" width="83" height="52" rx="8" opacity=".9"/>
    </g>
  </g>

  <g transform="translate(970 230)">
    <rect width="430" height="420" rx="32" fill="#071017" fill-opacity=".78" stroke="#50e7ff" stroke-opacity=".26"/>
    <rect x="30" y="32" width="155" height="9" rx="5" fill="#50e7ff" opacity=".55"/>
    <rect x="30" y="60" width="245" height="6" rx="3" fill="#ffffff" opacity=".12"/>
    <g transform="translate(35 125)">
      <rect width="74" height="210" rx="12" fill="#0b1620"/><rect x="93" y="42" width="74" height="168" rx="12" fill="#0b1620"/><rect x="186" y="-18" width="74" height="228" rx="12" fill="#0b1620"/><rect x="279" y="72" width="74" height="138" rx="12" fill="#0b1620"/>
      <rect y="70" width="74" height="140" rx="12" fill="#b7ff3c" fill-opacity=".8"/><rect x="93" y="95" width="74" height="115" rx="12" fill="#50e7ff" fill-opacity=".72"/><rect x="186" y="35" width="74" height="175" rx="12" fill="#b7ff3c" fill-opacity=".95"/><rect x="279" y="122" width="74" height="88" rx="12" fill="#50e7ff" fill-opacity=".55"/>
    </g>
    <circle cx="345" cy="72" r="18" fill="none" stroke="#b7ff3c" stroke-width="5" stroke-dasharray="70 45" filter="url(#glow)"/>
  </g>

  <rect x="120" y="565" width="1360" height="4" fill="url(#beam)" filter="url(#glow)"/>
  <g transform="translate(805 160)" fill="none" stroke="#b7ff3c" stroke-opacity=".55">
    <rect x="0" y="0" width="130" height="130" rx="24" stroke-dasharray="8 10"/>
    <path d="M24 38h82M24 56h82M24 74h58M24 92h72"/>
  </g>
  <g fill="#ffffff" opacity=".35"><circle cx="1375" cy="760" r="5"/><circle cx="1310" cy="820" r="3"/><circle cx="1440" cy="850" r="4"/></g>
</svg>
